[mod-setting-name]
ugf-pipes=Fill gaps after underground pipes
ugf-belts=Fill gaps after underground belts
ugf-blocked=Never fill with
ugf-pipe-choice=Pipe choice

[string-mod-setting]
ugf-pipe-choice-match=Same kind as the underground
ugf-pipe-choice-have=One I have or can craft
ugf-pipe-choice-researched=Researched pipes only

[mod-setting-description]
ugf-pipes=A pipe goes into the one-tile gap between two underground pipes, or between an underground pipe and a machine's pipe connection.
ugf-belts=A belt goes into the one-tile gap between an underground belt's exit and the next entrance, straight or round a corner.
ugf-blocked=Entity names never put into a gap, separated by commas or spaces (for example void-pipe). The next match is used instead, or the gap is left empty.
ugf-pipe-choice=Which pipe goes into a gap.\nSame kind: steel with steel, plain with plain; then one you have, can craft, or have researched.\nOne I have or can craft: from your inventory first, then one you can hand-craft, then the same kind.\nResearched only: never a pipe you haven't researched (unless you carry it), same kind first.\nA pipe that can't connect to the underground is never used.
